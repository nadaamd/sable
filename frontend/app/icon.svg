<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A book of four fields: three sealed, one cleared. The whole product in 32px. -->
  <rect width="32" height="32" fill="#08090b"/>
  <rect x="5"  y="6"  width="14" height="4" rx="1" fill="#3c434e"/>
  <rect x="5"  y="13" width="20" height="4" rx="1" fill="#3c434e"/>
  <rect x="5"  y="20" width="10" height="4" rx="1" fill="#3c434e"/>
  <rect x="21" y="20" width="6"  height="4" rx="1" fill="#e0b055"/>
</svg>
